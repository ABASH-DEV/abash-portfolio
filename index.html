<!DOCTYPE html>
<html>

<head>
<title>ABASH Portfolio</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    margin:0;
    font-family:Arial;
    background:#0f0f0f;
    color:white;
}

/* NAVBAR */
.navbar{
    background:#111;
    padding:15px;
    text-align:center;
}

.navbar a{
    color:gold;
    margin:10px;
    text-decoration:none;
}

/* HERO */
.hero{
    text-align:center;
    padding:50px 20px;
}

.hero img{
    width:140px;
    height:140px;
    border-radius:50%;
    border:3px solid gold;
}

h1{
    color:gold;
}

/* BUTTON */
button{
    background:gold;
    border:none;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:white;
}

/* CARD */
.card{
    background:#1a1a1a;
    margin:20px auto;
    max-width:500px;
    padding:20px;
    border-radius:10px;
}

/* INPUT */
input, textarea{
    width:90%;
    padding:10px;
    margin:10px 0;
    border:none;
    border-radius:5px;
}

/* SEND BUTTON */
.send{
    background:green;
    color:white;
}

</style>

</head>

<body>

<div class="navbar">
    <a href="#">Home</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
</div>

<div class="hero">
    <img src="https://via.placeholder.com/140">

    <h1>ABASH</h1>
    <p>Future Developer 🚀</p>

    <button onclick="alert('Na gode da ziyara!')">
        Hire Me
    </button>
</div>

<!-- ABOUT -->
<div class="card" id="about">
    <h2>About Me</h2>
    <p>student with a hope and a fully ambision to be a professional web developer.</p>
</div>

<!-- CONTACT FORM -->
<div class="card" id="contact">
    <h2>Contact Me</h2>

    <input type="text" id="name" placeholder="Your Name">
    <textarea id="message" placeholder="Your Message"></textarea>

    <button class="send" onclick="sendMessage()">
        Send Message
    </button>

    <p id="status"></p>
</div>

<script>

function sendMessage(){
    let name = document.getElementById("name").value;
    let msg = document.getElementById("message").value;

    if(name == "" || msg == ""){
        document.getElementById("status").innerHTML = "❌ Fill all fields";
    } else {
        document.getElementById("status").innerHTML =
        "✅ Thank you " + name + ", message sent!";
    }
}

</script>

</body>

</html>
